<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>XDNA2 NPU on Strix Halo: how NPU Wrench uses the array, with measured costs</title>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#0f1b2d"/>

  <text x="28" y="40" font-size="20" font-weight="700" fill="#f2f5f9">XDNA2 NPU on Strix Halo — one resident program, two stages</text>
  <text x="28" y="62" font-size="13" fill="#9fb0c4">8 columns × 4 compute rows; each column has a memory tile and a shim DMA to system memory</text>

  <!-- array: x0=40, col width 58, gap 6 -->
  <g font-size="11" fill="#cfd8e3">
    <text x="40" y="92" fill="#7fb2ff" font-weight="600">Stage A · columns 0–3</text>
    <text x="296" y="92" fill="#ffb86b" font-weight="600">Stage D · columns 4–7</text>
  </g>
  <g>
    <!-- compute rows (4) -->
    <g fill="#1f4f8f" stroke="#7fb2ff" stroke-width="1">
      <rect x="40" y="102" width="58" height="34" rx="4"/><rect x="104" y="102" width="58" height="34" rx="4"/><rect x="168" y="102" width="58" height="34" rx="4"/><rect x="232" y="102" width="58" height="34" rx="4"/>
      <rect x="40" y="142" width="58" height="34" rx="4"/><rect x="104" y="142" width="58" height="34" rx="4"/><rect x="168" y="142" width="58" height="34" rx="4"/><rect x="232" y="142" width="58" height="34" rx="4"/>
      <rect x="40" y="182" width="58" height="34" rx="4"/><rect x="104" y="182" width="58" height="34" rx="4"/><rect x="168" y="182" width="58" height="34" rx="4"/><rect x="232" y="182" width="58" height="34" rx="4"/>
      <rect x="40" y="222" width="58" height="34" rx="4"/><rect x="104" y="222" width="58" height="34" rx="4"/><rect x="168" y="222" width="58" height="34" rx="4"/><rect x="232" y="222" width="58" height="34" rx="4"/>
    </g>
    <g fill="#7a4413" stroke="#ffb86b" stroke-width="1">
      <rect x="296" y="102" width="58" height="34" rx="4"/><rect x="360" y="102" width="58" height="34" rx="4"/><rect x="424" y="102" width="58" height="34" rx="4"/><rect x="488" y="102" width="58" height="34" rx="4"/>
      <rect x="296" y="142" width="58" height="34" rx="4"/><rect x="360" y="142" width="58" height="34" rx="4"/><rect x="424" y="142" width="58" height="34" rx="4"/><rect x="488" y="142" width="58" height="34" rx="4"/>
      <rect x="296" y="182" width="58" height="34" rx="4"/><rect x="360" y="182" width="58" height="34" rx="4"/><rect x="424" y="182" width="58" height="34" rx="4"/><rect x="488" y="182" width="58" height="34" rx="4"/>
      <rect x="296" y="222" width="58" height="34" rx="4"/><rect x="360" y="222" width="58" height="34" rx="4"/><rect x="424" y="222" width="58" height="34" rx="4"/><rect x="488" y="222" width="58" height="34" rx="4"/>
    </g>
    <!-- memory tiles -->
    <g fill="#24364d" stroke="#5c7591" stroke-width="1">
      <rect x="40" y="266" width="250" height="24" rx="4"/><rect x="296" y="266" width="250" height="24" rx="4"/>
    </g>
    <text x="165" y="282" font-size="11" fill="#cfd8e3" text-anchor="middle">memory tiles: split weight blocks to 4 rows</text>
    <text x="421" y="282" font-size="11" fill="#cfd8e3" text-anchor="middle">memory tiles: split weight blocks to 4 rows</text>
    <!-- shims -->
    <g fill="#1a2a3e" stroke="#5c7591" stroke-width="1">
      <rect x="40" y="298" width="250" height="24" rx="4"/><rect x="296" y="298" width="250" height="24" rx="4"/>
    </g>
    <text x="165" y="314" font-size="11" fill="#cfd8e3" text-anchor="middle">shim DMA: stream q4nx weights</text>
    <text x="421" y="314" font-size="11" fill="#cfd8e3" text-anchor="middle">shim DMA: stream q4nx weights</text>
    <!-- arrows up from memory -->
    <g stroke="#9fb0c4" stroke-width="2" fill="none">
      <path d="M69 352 V326"/><path d="M133 352 V326"/><path d="M197 352 V326"/><path d="M261 352 V326"/>
      <path d="M325 352 V326"/><path d="M389 352 V326"/><path d="M453 352 V326"/><path d="M517 352 V326"/>
    </g>
    <g fill="#9fb0c4">
      <path d="M64 330 L69 322 L74 330 Z"/><path d="M128 330 L133 322 L138 330 Z"/><path d="M192 330 L197 322 L202 330 Z"/><path d="M256 330 L261 322 L266 330 Z"/>
      <path d="M320 330 L325 322 L330 330 Z"/><path d="M384 330 L389 322 L394 330 Z"/><path d="M448 330 L453 322 L458 330 Z"/><path d="M512 330 L517 322 L522 330 Z"/>
    </g>
    <rect x="40" y="354" width="506" height="28" rx="5" fill="#2b2f45" stroke="#6b6f8f"/>
    <text x="293" y="373" font-size="12" fill="#e6e8f2" text-anchor="middle">LPDDR5X, shared with CPU and iGPU: the weights live here</text>
  </g>
  <g font-size="12" fill="#cfd8e3">
    <text x="40" y="408">A: all 2048-input matrices (qkv, o-proj, gate|up, LM head)</text>
    <text x="40" y="428">D: expert down, with SiLU(gate)·up on the cores</text>
    <text x="40" y="448" fill="#9fb0c4">Stage picked by the instruction stream: no switch cost</text>
  </g>

  <!-- measured panel -->
  <rect x="590" y="84" width="342" height="360" rx="10" fill="#14243a" stroke="#2f4a6b"/>
  <text x="610" y="112" font-size="15" font-weight="700" fill="#f2f5f9">Measured on this box</text>
  <g font-size="13">
    <text x="610" y="146" fill="#9fb0c4">Dispatch (HRX)</text>
    <text x="912" y="146" fill="#f2f5f9" text-anchor="end">66 µs · 18 µs chained</text>
    <text x="610" y="176" fill="#9fb0c4">Switching programs</text>
    <text x="912" y="176" fill="#f2f5f9" text-anchor="end">2–3 ms → avoided</text>
    <text x="610" y="206" fill="#9fb0c4">Weight streaming, 4 cols</text>
    <text x="912" y="206" fill="#f2f5f9" text-anchor="end">~22 GB/s</text>
    <text x="610" y="236" fill="#9fb0c4">Bound by</text>
    <text x="912" y="236" fill="#f2f5f9" text-anchor="end">data movement, not compute</text>
    <text x="610" y="266" fill="#9fb0c4">Buffers per dispatch</text>
    <text x="912" y="266" fill="#f2f5f9" text-anchor="end">~5</text>
    <text x="610" y="296" fill="#9fb0c4">Open GEMM, large M</text>
    <text x="912" y="296" fill="#f2f5f9" text-anchor="end">17–19 TFLOPS</text>
  </g>
  <line x1="610" y1="316" x2="912" y2="316" stroke="#2f4a6b"/>
  <text x="610" y="346" font-size="13" fill="#9fb0c4">Hy-Memory-30B-A3B decode</text>
  <text x="912" y="350" font-size="22" font-weight="700" fill="#7fe0a8" text-anchor="end">9.4 tok/s</text>
  <text x="610" y="374" font-size="12" fill="#9fb0c4">every linear layer on the NPU · 4-bit q4nx</text>
  <text x="610" y="408" font-size="12" fill="#7fb2ff">Full measured map: REM</text>
  <text x="610" y="426" font-size="12" fill="#7fb2ff">docs/strix-halo-npu-measured-map.md</text>
</svg>
